<h1>Listado de productos</h1>

<div class="tabla-wrapper">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Producto</th>
        <th>Marca</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
      @for (p of productos; track p.id) {
        <tr>
          <td>{{ p.id }}</td>
          <td>{{ p.nombre }}</td>
          <td>{{ p.marca }}</td>
          <td>{{ p.descripcion }}</td>
          <td>{{ p.precio | currency: 'S/ ' }}</td>
          <td>
            @if (p.stock > 0) {
              <span class="badge ok">{{ p.stock }}</span>
            } @else {
              <span class="badge agotado">Agotado</span>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
